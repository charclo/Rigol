name: Build & Test 🧪

on:
  push:
    branches:
      - main

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # `submodules: recursive` is required to pull in NET_IPTE_SCPI (see .gitmodules).
      # If NET_IPTE_SCPI ever becomes a private repo outside this one's own access,
      # the default GITHUB_TOKEN won't be able to clone it — swap in a PAT with read
      # access to it via the `token:` input.
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup .NET 📦
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies 📂
        run: dotnet restore Rigol

      - name: Build 🧱
        run: dotnet build Rigol --configuration Release --no-restore
          
